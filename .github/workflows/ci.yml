name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --select E,F,W,B,I --ignore E501 src tests
      - name: Tests (synthetic data; the Kaggle CSV is not redistributed)
        run: pytest -q
      - name: "End to end on a second dataset (bundled with scikit-learn)"
        run: |
          tabml train -c configs/breast_cancer.yaml --out /tmp/artifacts
          python -c "import json,glob; m=json.load(open(sorted(glob.glob('/tmp/artifacts/breast_cancer/*/metadata.json'))[-1])); assert m['test']['metrics']['roc_auc'] > 0.9, m['test']['metrics']"
